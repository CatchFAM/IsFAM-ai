services:
  ai:
    build: .
    container_name: isfam_ai
    restart: unless-stopped
    environment:
      ISFAM_DATABASE_URL: postgresql+psycopg2://isfam:isfam@postgres:5432/isfam
      ISFAM_JWT_SECRET_KEY: ${ISFAM_JWT_SECRET_KEY:-local-compose-change-me}
      ISFAM_PRELOAD_MODELS: "true"
      ISFAM_PRELOAD_SPEAKER_MODEL: "false"
      ISFAM_ANTI_SPOOFING_BACKEND: spectral
      ISFAM_ANTI_SPOOFING_MODEL_VERSION: 2026-09-spectral-ensemble-v2
      ISFAM_ANTI_SPOOFING_THRESHOLD: "0.5"
      ISFAM_ANTI_SPOOFING_BATCH_SIZE: "4"
      ISFAM_ANTI_SPOOFING_MAX_CONCURRENCY: "2"
      ISFAM_VOICE_SESSION_MIN_ESTIMATED_SNR_DB: "25.0"
      ISFAM_DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - isfam_ai_models:/app/pretrained_models
      - isfam_ai_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: isfam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: isfam
      POSTGRES_PASSWORD: isfam
      POSTGRES_DB: isfam
    ports:
      - "5433:5432"
    volumes:
      - isfam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isfam -d isfam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  isfam_postgres_data:
  isfam_ai_models:
  isfam_ai_data:
